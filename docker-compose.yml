name: agent-orchestrator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orch
      POSTGRES_PASSWORD: orch
      POSTGRES_DB: orch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true before the DB accepts real queries during
      # first-boot init; the -d flag makes it check the actual target database.
      test: ["CMD-SHELL", "pg_isready -U orch -d orch"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # appendonly on: Redis is transport-only, but durable-ish transport means the
    # reaper has less straggler work to do after a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- observability stack -----------------------------------------------------
  # Entirely optional: the engine runs without any of it. Tracing degrades to
  # "produce spans, export nothing", and /metrics is served regardless.

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local-only convenience so the provisioned dashboard is one click away.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

  # Accepts OTLP spans over HTTP. Point the app at it with
  # AGENTORC_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4318:4318"
    volumes:
      - ./ops/otel/config.yaml:/etc/otel/config.yaml:ro

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
